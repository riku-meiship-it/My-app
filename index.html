<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SixTONES Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="color-bar" aria-hidden="true">
    <span class="c-red"></span><span class="c-pink"></span><span class="c-black"></span>
    <span class="c-yellow"></span><span class="c-green"></span><span class="c-blue"></span>
  </div>

  <button id="btn-bgm" class="bgm-toggle" aria-pressed="false" aria-label="BGMの再生・停止">
    <span class="bgm-bars" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="bgm-label">BGM OFF</span>
  </button>

  <main>
    <!-- メインページ -->
    <section id="screen-home" class="screen active">
      <p class="eyebrow">ストーンズ担のための超難問クイズ</p>
      <h1 class="title">
        <span class="title-six">Six</span><span class="title-tones">TONES</span>
        <span class="title-quiz">QUIZ</span>
      </h1>
      <div class="stones" aria-hidden="true">
        <span class="stone c-red"></span><span class="stone c-pink"></span><span class="stone c-black"></span>
        <span class="stone c-yellow"></span><span class="stone c-green"></span><span class="stone c-blue"></span>
      </div>
      <p class="lead">全200問からランダムに<strong>15問</strong>出題。<br>あなたは何問わかる？</p>
      <button id="btn-play" class="btn-play">PLAY</button>
    </section>

    <!-- クイズ画面 -->
    <section id="screen-quiz" class="screen">
      <div class="quiz-head">
        <span id="q-count" class="q-count">Q1 / 15</span>
      </div>
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <h2 id="q-text" class="q-text"></h2>
      <div id="choices" class="choices"></div>
      <div class="quiz-nav">
        <button id="btn-prev" class="btn-sub">← 前の問題</button>
        <button id="btn-quit" class="btn-sub">ホームへ戻る</button>
      </div>
      <div id="quit-confirm" class="quit-confirm" hidden>
        <p>クイズを中断してホームへ戻りますか？<br>ここまでの回答は保存されません。</p>
        <div class="quit-actions">
          <button id="btn-quit-yes" class="btn-quit-yes">中断する</button>
          <button id="btn-quit-no" class="btn-sub">続ける</button>
        </div>
      </div>
    </section>

    <!-- 結果画面 -->
    <section id="screen-result" class="screen">
      <p class="eyebrow">RESULT</p>
      <p class="result-score"><span id="result-num">0</span><small> / 15</small></p>
      <p id="result-rank" class="result-rank"></p>
      <p id="result-msg" class="result-msg"></p>
      <h3 class="review-title">解答と解説</h3>
      <ol id="review" class="review"></ol>
      <div class="result-actions">
        <button id="btn-retry" class="btn-play">もう一度</button>
        <button id="btn-home" class="btn-sub">トップへ</button>
      </div>
    </section>
  </main>

  <script src="questions.js"></script>
  <script src="bgm.js"></script>
  <script src="app.js"></script>
</body>
</html>
